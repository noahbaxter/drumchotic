<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drumchotic explorer</title>
<style>
  :root {
    --surface: #1a1a19; --raised: #222221; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8a897f;
    --grid: #2c2c2a; --line: #3a3a37; --accent: #3987e5; --bad: #e34948; --easy: #6aa8f2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 24px 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  header .ref { font-size: 13px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 8px; }
  #ref button { padding: 4px 12px; }
  header .ref-note { flex-basis: 100%; font-size: 12px; color: var(--ink-3); margin-top: -6px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--grid);
         padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span, .spot .lbl { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); }
  input, select { height: 32px; background: var(--raised); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
                  padding: 0 10px; font: inherit; font-size: 13px; }
  input::placeholder { color: #66655e; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  select { appearance: none; -webkit-appearance: none; padding-right: 28px; cursor: pointer;
           background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238a897f' stroke-width='1.5'/></svg>");
           background-repeat: no-repeat; background-position: right 10px center; }
  /* drumchotic | human tier pair, laid out like the table's column groups */
  .pair { display: flex; }
  .pair .field { padding: 0 10px; }
  .pair .field:first-child { padding-left: 0; }
  .pair .field.sep { border-left: 1px solid var(--line); }
  #q { width: 280px; padding-left: 30px;
       background: var(--raised) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14'><circle cx='6' cy='6' r='4.5' fill='none' stroke='%238a897f' stroke-width='1.5'/><path d='M9.5 9.5l3.5 3.5' stroke='%238a897f' stroke-width='1.5'/></svg>") no-repeat 10px center; }
  /* fixed widths, so flipping DMT / RB doesn't shift the bar */
  #tn { width: 230px; }
  #dt, #tier { width: 110px; }
  #why { width: 150px; }
  .num { width: 58px; text-align: center; -moz-appearance: textfield; }
  .num::-webkit-inner-spin-button, .num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  button { font: inherit; cursor: pointer; }
  #reset { height: 32px; background: none; border: 0; color: var(--ink-3); padding: 0 6px; font-size: 13px; }
  #reset:hover { color: var(--ink); }
  main { padding: 16px 24px 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); gap: 20px; }
  .panel { min-width: 0; }
  .panel h2 { font-size: 15px; font-weight: 500; margin: 0 0 8px; }
  .panel h2 span { color: var(--ink-3); font-weight: 400; }
  .panel .cap { color: var(--ink-3); font-size: 12px; margin: -4px 0 8px; }
  .wide { grid-column: 1 / -1; }
  canvas, svg { display: block; width: 100%; }
  .tip { position: fixed; pointer-events: none; background: #2a2a28; border: 1px solid var(--line); border-radius: 6px;
         padding: 6px 9px; font-size: 12px; color: var(--ink); display: none; z-index: 10; max-width: 340px; }
  .tip b { font-weight: 600; }
  .tip .m { color: var(--ink-2); }
  .tip .rows, .tip .facts { display: grid; justify-content: start; gap: 2px 12px; font-variant-numeric: tabular-nums; }
  .tip .rows { grid-template-columns: auto auto auto auto; margin-top: 6px; }
  .tip .facts { grid-template-columns: auto minmax(0, 240px); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--ink-2); }
  .tip .k { color: var(--ink-3); }
  .tip .miss { font-weight: 600; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--ink-3); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; position: sticky; top: var(--bar, 57px); background: var(--surface); }
  th:hover { color: var(--ink); }
  td.n, th.n { text-align: right; }
  td.t { white-space: normal; min-width: 260px; }
  td.w { color: var(--ink-2); white-space: normal; }
  .spot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 2px 0 12px; }
  .spot .seg button { min-width: 42px; font-variant-numeric: tabular-nums; }
  #thinval { font-size: 12px; color: var(--ink-3); }
  h1 .built { color: var(--ink-3); font-size: 12px; font-weight: 400; margin-left: 8px; }
  tr.groups th { cursor: default; position: static; text-align: center; color: var(--ink-2); border-bottom: 0; padding-bottom: 0; }
  th.sep, td.sep { border-left: 1px solid var(--line); }
  /* tier numbers wear their difficulty colour (set per cell), diff stays plain */
  .di { color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; vertical-align: 1px; }
  .seg button { border: 0; border-radius: 0; padding: 4px 12px; font-size: 13px; background: transparent; color: var(--ink-3); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .more { color: var(--ink-3); padding: 10px 8px; }
  #tourn { overflow-x: auto; }
  #tourn table { width: auto; }
  #tourn th { position: static; cursor: default; text-align: center; min-width: 52px; }
  #tourn th:first-child, #tourn td:first-child { text-align: left; min-width: 90px; }
  #tourn td { text-align: center; font-weight: 600; }
  #tourn td.empty { color: var(--grid); font-weight: 400; }
  #tourn [data-c] { padding: 1px 4px; border-radius: 4px; outline: 1.5px solid transparent; cursor: default; }
  #tourn [data-c]:hover { outline-color: var(--ink); }
  /* white ring over the hovered dot on a chart */
  .ring { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid var(--ink);
          border-radius: 50%; pointer-events: none; display: none; }
  /* from the hovered dot to the dashed line: how far the notes missed the plays */
  .miss-line { position: absolute; width: 2px; margin-left: -1px; pointer-events: none; display: none; }
  .holder { position: relative; }
  #tourn td sub { color: var(--ink-3); font-size: 10px; font-weight: 400; margin-left: 2px; vertical-align: baseline; }
  #tourn svg { width: 100%; }
  @media (max-width: 600px) { main { grid-template-columns: 1fr; padding: 12px 16px; } .bar { padding: 10px 16px; } #q { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>drumchotic explorer <span class="built">built <span id="built"></span></span></h1>
  <span class="ref">difficulty on the <span class="seg" id="ref"><button data-v="dmt" title="Drummer's Monthly tournament tiers">Drummer's Monthly</button><button data-v="rb" title="official Rock Band setlist tiers">Rock Band</button></span> scale</span>
  <span class="ref-note" id="refnote"></span><span class="ref-note" id="refacc"></span>
</header>
<div class="bar">
  <label class="field"><span>search</span><input id="q" placeholder="artist, song, charter, genre..." title="matches artist, title, album, charter, genre, year; commas match any term"></label>
  <label class="field"><span id="tnlabel">tournament</span><select id="tn"></select></label>
  <div class="pair">
    <label class="field"><span>drumchotic</span><select id="dt"><option value="">any</option></select></label>
    <label class="field sep"><span>human</span><select id="tier"><option value="">any tier</option></select></label>
  </div>
  <label class="field"><span>skill</span><select id="why"><option value="">any</option></select></label>
  <label class="field"><span>min players</span><input id="ns" class="num" type="number" min="0" step="1" placeholder="0"></label>
  <button id="reset">reset</button>
</div>
<main>
  <section class="panel"><h2>Difficulty <span>grey = whole library</span></h2><svg id="hist"></svg></section>
  <section class="panel"><h2>note vs play <span id="sp"></span></h2>
    <p class="cap">note: our rating. play: how hard players found it. On the line = rated right.<span id="acc"></span></p><div class="holder"><canvas id="scatter"></canvas><div class="miss-line" id="sline"></div><div class="ring" id="sring"></div></div></section>
  <section class="panel wide"><h2>Tournaments <span class="seg" id="tview"><button data-v="grid">grid</button><button data-v="dots">chart</button></span>
    <span class="seg" id="tplace"><button data-v="given">as placed</button><button data-v="closest">as rated</button></span>
    <span id="tsub"></span></h2><div id="tourn"></div></section>
  <section class="panel wide"><h2>What makes charts hard <span>bar = middle half, dot = typical, tick = whole library</span></h2><svg id="axes"></svg></section>
  <section class="panel wide"><h2>Charts <span id="tcount"></span></h2>
    <div class="spot"><span class="lbl">spot check</span><span class="seg" id="spotseg"></span><span id="thinval"></span>
      <input type="hidden" id="samples" value="6"></div>
    <table id="table"></table></section>
</main>
<div class="tip" id="tip"></div>
<script>
const DATA = /*DATA*/null;
const {axes: AXES, groups: GROUPS, charts: ALL} = DATA;
document.getElementById('built').textContent = DATA.built;
const STOPS = ['#9085e9', '#3987e5', '#1baf7a', '#eda100', '#eb6834', '#e34948'];   // difficulty ramp, as in plots.py
// the page's primary colour lives in CSS (--accent); charts read it from there
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();   // canvas can't read var()
const ACCENT = cssVar('--accent');
const ROWS = 300;   // table rows drawn at a time; scrolling near the end draws the next batch
let rowsShown = ROWS;
// spot check slider stops; one past the last means every chart
const SAMPLE_SIZES = [10, 25, 50, 100, 250, 500];
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
ALL.forEach((c, i) => { c.i = i; c.name = (c.a ? c.a + ' - ' : '') + c.t; c.low = c.name.toLowerCase(); c.find = (c.s || '') + ' ' + c.low;
  // each axis as a percent of the chart's total, for "what makes charts hard"
  const tot = c.sh.reduce((p, q) => p + q, 0); c.pc = c.sh.map(v => tot > 0 ? v / tot * 100 : 0); });

function hex(h) { return [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16)); }
function levelColor(lv) {
  const t = Math.min(Math.max((lv - 1) / 7, 0), 1) * (STOPS.length - 1), k = Math.min(Math.floor(t), STOPS.length - 2), f = t - k;
  const a = hex(STOPS[k]), b = hex(STOPS[k + 1]);
  return `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * f)).join(',')})`;
}
function median(v) { if (!v.length) return NaN; const s = [...v].sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function quantile(s, q) { const p = (s.length - 1) * q, k = Math.floor(p); return s[k] + (s[Math.min(k + 1, s.length - 1)] - s[k]) * (p - k); }
function ranks(v) {
  const o = v.map((x, i) => [x, i]).sort((a, b) => a[0] - b[0]), r = new Array(v.length);
  for (let i = 0; i < o.length;) { let j = i; while (j + 1 < o.length && o[j + 1][0] === o[i][0]) j++; for (let k = i; k <= j; k++) r[o[k][1]] = (i + j) / 2; i = j + 1; }
  return r;
}
function spearman(x, y) {
  if (x.length < 3) return NaN;
  const a = ranks(x), b = ranks(y), n = a.length, ma = (n - 1) / 2;
  let num = 0, da = 0, db = 0;
  for (let i = 0; i < n; i++) { num += (a[i] - ma) * (b[i] - ma); da += (a[i] - ma) ** 2; db += (b[i] - ma) ** 2; }
  return num / Math.sqrt(da * db);
}
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; }
// What drumchotic's tier is read against: DMT tournament tiers or official Rock Band tiers. It sets the
// scale of drumchotic's tier and which human tiers the filters, the table and the tournaments panel show.
const [RB_A, RB_B] = DATA.refs.rb.toDmt;   // Rock Band scale value -> DMT tier, for colours
const RB_ORDER = ['RB1', 'RB1 DLC', 'RB2', 'RB2 DLC', 'RB3', 'Green Day RB', 'Lego RB', 'RB Blitz', 'RB4', 'RB Rivals'];
const rbShort = g => g.replace(/Rock Band (\d)/, 'RB$1').replace('Rock Band', 'RB');
const range = (a, b) => Array.from({length: b - a + 1}, (_, i) => a + i);
const REFS = {
  // unit labels drumchotic's own numbers (DM 4.6); prefix labels the human tiers they're read against (T3)
  dmt: {name: 'DMT', unit: 'DM', prefix: 'T', scale: c => c.lv, human: c => c.tn, toLevel: v => v, marks: DATA.refs.dmt.marks,
        tiers: range(1, 8), dtTop: 8, groups: GROUPS, groupLabel: 'tournament', anyGroup: 'any tournament', humanKind: 'DMT tournament',
        note: "DM 3 = plays like a tier 3 song in a Drummer's Monthly tournament.",
        help: "drumchotic: difficulty on the Drummer's Monthly scale, DM 1 to 8 (past 8 keeps counting, below 1 = easier than tier 1)",
        humanHelp: 'human: where a DMT tournament placed it (hover a cell for which)',
        panel: "each tier's typical DM"},
  rb: {name: 'RB', unit: 'RB', prefix: 'T', scale: c => c.rbv, human: c => c.rb ? [[c.rb[1], c.rb[0]]] : [], toLevel: v => RB_A + RB_B * v, humanKind: 'official Rock Band',
       note: 'RB 3 = plays like a tier 3 song in official Rock Band.',
       marks: DATA.refs.rb.marks, tiers: range(0, 6), dtTop: 10, groupLabel: 'rock band game', anyGroup: 'any official chart',
       groups: [...new Set(ALL.filter(c => c.rb).map(c => c.rb[1]))].sort((a, b) =>
         ((RB_ORDER.indexOf(rbShort(a)) + 1) || 99) - ((RB_ORDER.indexOf(rbShort(b)) + 1) || 99)),
       help: 'drumchotic: difficulty on the Rock Band scale, RB 0 to 6 (past 6 keeps counting)',
       humanHelp: 'human: official Rock Band drum tier, 0 (warmup) to 6 (devils), hover for the game',
       panel: "each tier's typical RB, per game (The Beatles left out)"},
};
let refMode = 'dmt';
try { refMode = localStorage.getItem('drumchotic-ref') || 'dmt'; } catch (e) {}
if (!REFS[refMode]) refMode = 'dmt';
const REF = () => REFS[refMode];
// raw difficulty (the leaderboard fit's and the model's own unit) -> the reference's tier
const rawToTier = v => { const [a, b] = DATA.refs[refMode].fromRaw; return a + b * v; };
// where a raw difficulty sits in the library: 'top 14%' means harder than 86% of charts
const LIB_D = ALL.map(c => c.d).sort((a, b) => a - b);
function topPct(raw) {
  let lo = 0, hi = LIB_D.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (LIB_D[mid] <= raw) lo = mid + 1; else hi = mid; }
  const t = Math.max(100 * (LIB_D.length - lo) / LIB_D.length, 0.1);
  return `top ${t < 10 ? t.toFixed(1) : Math.round(t)}%`;
}
const lengthTiers = c => refMode === 'rb' ? c.ln / RB_B : c.ln;   // c.ln is in DMT tiers
const tierOf = c => REF().scale(c);
const rated = v => `${REF().unit}&nbsp;${v.toFixed(1)}`;   // a drumchotic number with its scale: 'DM 4.6'
const tierColor = v => levelColor(REF().toLevel(v));
const humanTiers = c => REF().human(c);
function tierText(c) { return humanTiers(c).map(([g, t]) => `${REF().prefix}${t} ${g.replace(' Setlist', '')}`).join(', '); }

// filter bar; the tournament, human tier and drumchotic tier lists follow the reference
function refControls() {
  const R = REF();
  $('tnlabel').textContent = R.groupLabel;
  $('tn').innerHTML = `<option value="">all charts</option><option value="*">${R.anyGroup}</option>` + R.groups.map(g => `<option>${g}</option>`).join('');
  $('tier').innerHTML = '<option value="">any tier</option>' + R.tiers.map(t => `<option value="${t}">tier ${t}</option>`).join('');
  // drumchotic: whole steps (5 = 5.0 to 5.9), with everything from dtTop up in one
  $('dt').innerHTML = '<option value="">any</option>' + range(0, R.dtTop - 1).map(t =>
    `<option value="${t}">${t === 0 && refMode === 'dmt' ? 'below DM 1' : R.unit + ' ' + t}</option>`).join('') + `<option value="${R.dtTop}">${R.unit} ${R.dtTop}+</option>`;
  $('tsub').textContent = R.panel;
  // accuracy is in raw units; the scale's slope turns it into this scale's steps
  const acc = q => (DATA.accuracy[q] * DATA.refs[refMode].fromRaw[1]).toFixed(1);
  $('refnote').textContent = R.note;
  $('refacc').textContent = `Usually within ±${acc('q80')} of how players score it.`;
  $('acc').textContent = ` 8 in 10 within ${acc('q80')}.`;
  document.querySelectorAll('#ref button').forEach(b => b.classList.toggle('on', b.dataset.v === refMode));
}
refControls();
document.querySelectorAll('#ref button').forEach(b => b.onclick = () => {
  if (b.dataset.v === refMode) return;
  refMode = b.dataset.v; try { localStorage.setItem('drumchotic-ref', refMode); } catch (e) {}
  sview.zoom = 1; sview.cx = sview.cy = null;   // the scatter's axes change scale
  refControls(); update();   // the tier filters meant tiers on the old reference, so they start over
});
AXES.forEach((a, i) => $('why').insertAdjacentHTML('beforeend', `<option value="${i}">${a}</option>`));
const CONTROLS = ['q', 'tn', 'tier', 'dt', 'why', 'ns', 'samples'];
try { const saved = JSON.parse(localStorage.getItem('drumchotic-filters') || '{}'); CONTROLS.forEach(k => { if (saved[k] != null) $(k).value = saved[k]; }); } catch (e) {}
// ?q=car+bomb&tn=Icebreaker+2024+Setlist&tier=7 overrides the remembered filters
const params = new URLSearchParams(location.search);
if ([...params.keys()].some(k => CONTROLS.includes(k))) CONTROLS.forEach(k => $(k).value = params.get(k) ?? (k === 'samples' ? SAMPLE_SIZES.length : ''));
CONTROLS.forEach(k => $(k).addEventListener('input', update));
$('spotseg').innerHTML = [...SAMPLE_SIZES, 'all'].map((n, i) => `<button data-i="${i}">${n}</button>`).join('');
$('spotseg').querySelectorAll('button').forEach(b => b.onclick = () => { $('samples').value = b.dataset.i; update(); });
// the table header sticks just under the filter bar, whatever height the bar wraps to
const barHeight = () => document.documentElement.style.setProperty('--bar', document.querySelector('.bar').offsetHeight + 'px');
barHeight(); addEventListener('resize', barHeight);
// clicking into a text box selects what's there, so it can be typed over or deleted at once
// (after the click finishes, or the mouseup would clear the selection again)
document.querySelectorAll('.bar input').forEach(i => i.addEventListener('focus', () => setTimeout(() => i.select())));
$('reset').onclick = () => { CONTROLS.forEach(k => $(k).value = ''); $('samples').value = SAMPLE_SIZES.length; update(); };

function filtered() {
  const terms = $('q').value.toLowerCase().split(',').map(s => s.trim()).filter(Boolean);
  const tn = $('tn').value, tier = +$('tier').value || 0, why = $('why').value;
  const dt = $('dt').value, lo = dt === '' || +dt === 0 ? -Infinity : +dt, hi = dt === '' || +dt === REF().dtTop ? Infinity : +dt + 1;
  const ns = +$('ns').value || 0, tierOn = $('tier').value !== '';
  return ALL.filter(c => {
    if (terms.length && !terms.some(t => c.find.includes(t))) return false;
    if (tierOf(c) < lo || tierOf(c) >= hi || c.n < ns) return false;
    if (why !== '' && !c.why.includes(+why)) return false;
    if (tn || tierOn) {
      const hits = humanTiers(c).filter(([g, t]) => (!tn || tn === '*' || g === tn) && (!tierOn || t === tier));
      if (!hits.length) return false;
    }
    return true;
  });
}

// tooltip
const tip = $('tip');
// With a mark to anchor to ({left, right, top} in page px: the hovered column or dot), the tip sits
// just right of it at a steady height (left of it when there's no room), so it never covers what's
// being pointed at; without one it follows the mouse.
const TIP_GAP = 10;
function showTip(e, html, mark) {
  tip.innerHTML = html; tip.style.display = 'block';
  let x, y;
  if (mark) {
    x = mark.right + TIP_GAP;
    if (x + tip.offsetWidth > innerWidth - 8) x = mark.left - TIP_GAP - tip.offsetWidth;
    y = mark.top;
  } else {
    x = e.clientX + 14; y = e.clientY + 14;
  }
  tip.style.left = Math.max(8, Math.min(x, innerWidth - tip.offsetWidth - 8)) + 'px';
  tip.style.top = Math.max(8, Math.min(y, innerHeight - tip.offsetHeight - 8)) + 'px';
}
// an svg region (svg units) as page px for showTip
function svgMark(svg, W, H, x0, x1, y0) {
  const r = svg.getBoundingClientRect(), k = r.width / W;
  return {left: r.left + x0 * k, right: r.left + x1 * k, top: r.top + y0 * (r.height / H)};
}
function hideTip() { tip.style.display = 'none'; }

// histogram: drumchotic's tier on the reference's scale, each of the reference's human tiers marked at its median
function histView() {
  const R = REF();
  return {key: R.scale, bin: refMode === 'rb' ? 0.5 : 0.25, cap: refMode === 'rb' ? 30 : 20, name: R.unit, marks: R.marks.map(([t, v]) => [R.prefix + t, v]),
    toLevel: R.toLevel, label: `${R.unit} (dotted = typical ${R.humanKind} tier)`};
}
const HIST_EXAMPLES = 3;   // charts listed when hovering a histogram bar
function drawHist(sel) {
  const view = histView(), key = view.key, BIN = view.bin;
  const svg = $('hist'), W = svg.clientWidth || 600, H = 300, m = {l: 44, r: 10, t: 40, b: 34};

    const near = meds.get(g).reduce((p, q) => Math.abs(y(q[1]) - py) < Math.abs(y(p[1]) - py) ? q : p);
    light(dots.get(near));
    tourneyTip(e, svgMark(svg, W, H, m.l + col * i, m.l + col * (i + 1), m.t), g, ...near);
  });
  hit.addEventListener('mouseleave', () => { hideTip(); band.setAttribute('visibility', 'hidden'); light(null); });
}

// axis shares
function drawAxes(sel) {
  const svg = $('axes'), W = svg.clientWidth || 900, row = 26, m = {l: 150, r: 70, t: 22, b: 30};
  const libMed = AXES.map((_, a) => median(ALL.map(c => c.pc[a])));
  const order = AXES.map((_, a) => a).sort((p, q) => libMed[q] - libMed[p]);
  const H = m.t + m.b + row * AXES.length;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H); svg.innerHTML = '';
  const stats = AXES.map((_, a) => { const s = sel.map(c => c.pc[a]).sort((p, q) => p - q);
    return s.length ? [quantile(s, 0.25), quantile(s, 0.5), quantile(s, 0.75)] : null; });
  const top = Math.ceil(Math.max(...stats.filter(Boolean).map(s => s[2]), ...libMed, 1) * 1.08 / 5) * 5;
  const x = v => m.l + v / top * (W - m.l - m.r);
  // a gridline every 5% (10% on a wide scale), labelled above and below
  const step = top > 50 ? 10 : 5;
  for (let v = 0; v <= top; v += step) {
    el('line', {x1: x(v), x2: x(v), y1: m.t, y2: H - m.b, stroke: '#2c2c2a'}, svg);
    [m.t - 8, H - m.b + 16].forEach(ty => el('text', {x: x(v), y: ty, 'text-anchor': 'middle', fill: '#c3c2b7', 'font-size': 11}, svg).textContent = v + '%'); }
  el('text', {x: W - 6, y: m.t - 8, 'text-anchor': 'end', fill: '#8a897f', 'font-size': 11}, svg).textContent = 'typical';
  // band behind the hovered row, drawn first so the marks sit on top of it
  const band = el('rect', {x: 0, width: W, height: row, fill: '#f0efec', 'fill-opacity': 0.06, rx: 3, visibility: 'hidden'}, svg);
  const bars = {};
  order.forEach((a, k) => {
    const yy = m.t + row * k + row / 2, s = stats[a];
    el('text', {x: m.l - 10, y: yy + 4, 'text-anchor': 'end', fill: '#c3c2b7', 'font-size': 12}, svg).textContent = AXES[a];
    if (s) { bars[a] = el('rect', {x: x(s[0]), y: yy - 6, width: Math.max(x(s[2]) - x(s[0]), 2), height: 12, fill: ACCENT, rx: 3}, svg);
      el('circle', {cx: x(s[1]), cy: yy, r: 4.5, fill: '#f0efec', stroke: '#1a1a19', 'stroke-width': 1.5}, svg);
      // the middle half's ends, written at each end of the bar
      const pct = v => v.toFixed(v < 10 ? 1 : 0);
      if (x(s[0]) - m.l > 26) el('text', {x: x(s[0]) - 5, y: yy + 4, 'text-anchor': 'end', fill: '#8a897f', 'font-size': 10}, svg).textContent = pct(s[0]);
      el('text', {x: Math.max(x(s[2]), x(libMed[a])) + 6, y: yy + 4, fill: '#8a897f', 'font-size': 10}, svg).textContent = pct(s[2]);
      el('text', {x: W - 6, y: yy + 4, 'text-anchor': 'end', fill: '#c3c2b7', 'font-size': 11}, svg).textContent = s[1].toFixed(s[1] < 10 ? 1 : 0) + '%'; }
    el('line', {x1: x(libMed[a]), x2: x(libMed[a]), y1: yy - 9, y2: yy + 9, stroke: '#f0efec', 'stroke-width': 2}, svg);
  });
  // one hover layer on top of every mark, picking the row from the mouse height
  const hit = el('rect', {x: 0, y: m.t, width: W, height: row * AXES.length, fill: 'transparent'}, svg);
  hit.addEventListener('mousemove', e => {
    const box = svg.getBoundingClientRect(), py = (e.clientY - box.top) * H / box.height;
    const k = Math.min(Math.max(Math.floor((py - m.t) / row), 0), AXES.length - 1), a = order[k], s = stats[a];
    band.setAttribute('y', m.t + row * k); band.setAttribute('visibility', 'visible'); light(bars[a] || null);
    showTip(e, `<b>${AXES[a]}</b><br>` + (s ? `filtered: median ${s[1].toFixed(1)}%, middle half ${s[0].toFixed(1)}% to ${s[2].toFixed(1)}%<br>` : '') + `library median ${libMed[a].toFixed(1)}%`,
      svgMark(svg, W, H, s ? x(s[0]) : m.l, Math.max(s ? x(s[2]) : 0, x(libMed[a])) + 44, m.t + row * k));
  });
  hit.addEventListener('mouseleave', () => { hideTip(); band.setAttribute('visibility', 'hidden'); light(null); });
  el('text', {x: (W + m.l) / 2, y: H - 4, 'text-anchor': 'middle', fill: '#c3c2b7', 'font-size': 12}, svg).textContent = "share of each chart's difficulty (adds up to 100%)";
}

// table
// [label, sort key, cell class, hover text]; drumchotic's call and the human one side by side
const placedTiers = c => [...new Set(humanTiers(c).map(([, t]) => t))].sort((a, b) => a - b);
// the two tier columns follow the reference: hover text comes from REF() where it's null here
const COLS = [
  ['#', null, 'n', ''],
  ['tier', c => c.lv, 'n', null],   // every reference's scale keeps the same order
  ['top', c => c.d, 'n di', 'drumchotic: share of the library at least this hard'],
  ['tier', c => placedTiers(c)[0] ?? -1, 'n sep', null],
  ['diff', c => c.r ?? -1, 'n di', "human: what the chart's song.ini says"],
  ['players', c => c.n, 'n sep', 'players with a score on the leaderboard'],
  ['chart', c => c.low, 't', ''],
  ['skills', null, 'w', 'axes where this chart beats 85% of charts near its difficulty'],
];
const CHART_COL = 6;
let sortCol = 1, sortDir = -1;
function sample(sel) {
  // sort by tier, cut into exactly that many equal-size groups and keep each group's most played
  // chart, so the ladder can be spot-checked with familiar songs
  const want = SAMPLE_SIZES[+$('samples').value];
  if (!want || sel.length <= want) return {rows: sel, every: 0};
  const byTier = [...sel].sort((a, b) => a.lv - b.lv), rows = [];
  for (let g = 0; g < want; g++) {
    const chunk = byTier.slice(Math.floor(g * byTier.length / want), Math.floor((g + 1) * byTier.length / want));
    rows.push(chunk.reduce((p, q) => q.n > p.n ? q : p));
  }
  return {rows, every: sel.length / want};
}
const moreRows = new IntersectionObserver(seen => {
  if (seen.some(e => e.isIntersecting)) { rowsShown += ROWS; drawTable(current, true); }
}, {rootMargin: '800px'});
function drawTable(all, more = false) {
  if (!more) rowsShown = ROWS;
  const {rows: sel, every} = sample(all);
  const key = COLS[sortCol][1], rows = key ? [...sel].sort((a, b) => { const p = key(a), q = key(b); return (p < q ? -1 : p > q ? 1 : 0) * sortDir; }) : sel;
  const groups = '<tr class="groups"><th></th><th colspan="2">drumchotic</th><th colspan="2" class="sep">human</th><th colspan="3" class="sep"></th></tr>';
  const R = REF(), helpOf = (help, k) => help ?? (k === 1 ? R.help : R.humanHelp);
  const head = groups + '<tr>' + COLS.map(([n, , cls, help], k) => `<th class="${cls.replace(/\b[tw]\b/, '')}" data-k="${k}" title="${helpOf(help, k)}">${k === 1 ? R.unit : n}${k === sortCol ? (sortDir < 0 ? ' ↓' : ' ↑') : ''}</th>`).join('') + '</tr>';
  const body = rows.slice(0, rowsShown).map((c, k) => {
    const placed = placedTiers(c);
    return `<tr><td class="n">${k + 1}</td><td class="n" style="color:${levelColor(c.lv)}">${tierOf(c).toFixed(1)}</td>`
      + `<td class="n di">${topPct(c.d).slice(4)}</td>`
      + `<td class="n sep" title="${esc(tierText(c))}" style="color:${placed.length ? tierColor(placed[0]) : 'inherit'}">${placed.length ? R.prefix + placed.join('/') : ''}</td>`
      + `<td class="n di">${c.r ?? ''}</td><td class="n sep">${c.n || ''}</td><td class="t">${esc(c.name)}</td>`
      + `<td class="w">${c.why.map(i => AXES[i]).join(', ')}</td></tr>`; }).join('');
  const left = rows.length - rowsShown;
  $('table').innerHTML = head + body + (left > 0 ? `<tr id="more"><td colspan="8" class="more">loading ${left} more...</td></tr>` : '');
  moreRows.disconnect();
  if (left > 0) moreRows.observe($('more'));
  $('table').querySelectorAll('th[data-k]').forEach(th => th.onclick = () => { const k = +th.dataset.k; if (!COLS[k][1]) return;
    sortDir = k === sortCol ? -sortDir : (k === CHART_COL ? 1 : -1); sortCol = k; drawTable(current); });
  $('tcount').textContent = 'click to sort, hover a header for help';
  $('spotseg').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.i === +$('samples').value));
  $('thinval').textContent = every
    ? `${sel.length} of ${all.length}: the most played of every ${Math.round(every)} charts in difficulty order`
    : all.length < ALL.length ? `showing all ${all.length} that match` : `showing all ${all.length}`;
}
function esc(s) { return s.replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch])); }

let current = ALL;
function update() {
  try { localStorage.setItem('drumchotic-filters', JSON.stringify(Object.fromEntries(CONTROLS.map(k => [k, $(k).value])))); } catch (e) {}
  current = filtered();
  drawHist(current); drawScatter(current); drawTournaments(); drawAxes(current); drawTable(current);
}
addEventListener('resize', () => update());
update();
</script>
</body>
